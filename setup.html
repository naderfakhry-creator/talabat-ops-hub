<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحميل البوت — Talabat Ops Hub</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #222; min-height: 100vh; }
  header { background: #ff6b00; color: white; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 20px; font-weight: 600; }
  .back { color: white; text-decoration: none; font-size: 14px; opacity: 0.9; }
  .back:hover { opacity: 1; }
  .container { max-width: 700px; margin: 40px auto; padding: 0 24px; }
  .card { background: white; border-radius: 12px; border: 1px solid #e5e5e5; padding: 24px; margin-bottom: 16px; }
  .step { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 24px; }
  .step:last-child { margin-bottom: 0; }
  .step-num { background: #ff6b00; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .step-content { flex: 1; }
  .step-content h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .step-content p { font-size: 13px; color: #666; line-height: 1.6; }
  .btn { display: inline-block; padding: 9px 18px; background: #ff6b00; color: white; border-radius: 8px; font-size: 13px; font-weight: 500; text-decoration: none; transition: background 0.15s; }
  .btn:hover { background: #e05e00; }
  .btn-secondary { background: white; color: #ff6b00; border: 1.5px solid #ff6b00; }
  .btn-secondary:hover { background: #fff5ee; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .guide { background: #f9f9f9; border-radius: 8px; padding: 12px 14px; border: 1px solid #eee; margin-top: 10px; }
  .guide-title { font-size: 12px; font-weight: 600; color: #ff6b00; margin-bottom: 8px; }
  .guide ol { padding-right: 18px; }
  .guide ol li { font-size: 12px; color: #555; line-height: 1.8; }
  .guide b { color: #222; }
  .note { background: #fff8f0; border: 1px solid #ffd4a8; border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #994400; margin-top: 16px; }
  .title { font-size: 20px; font-weight: 600; margin-bottom: 6px; text-align: center; }
  .desc { font-size: 14px; color: #888; margin-bottom: 24px; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>تحميل البوت</h1>
  <a class="back" href="index.html">← رجوع للرئيسية</a>
</header>

<div class="container">
  <div id="content"></div>
</div>

<script>
const bots = {
  revoke_all: {
    title: "Revoke All Breaks",
    desc: "بيفك كل أنواع البريكات للطيارين في الشيت",
    py_raw: "https://raw.githubusercontent.com/naderfakhry-creator/talabat-ops-hub/main/bots/revoke_all/hurrier_bot.py",
    bat_raw: "https://raw.githubusercontent.com/naderfakhry-creator/talabat-ops-hub/main/bots/revoke_all/run_revoke_all.bat",
    pip: "pip install selenium gspread google-auth"
  },
  revoke_main: {
    title: "Revoke Main Breaks",
    desc: "بيفك البريكات العادية بس — بيتجنب بريكات السيستم",
    py_raw: "https://raw.githubusercontent.com/naderfakhry-creator/talabat-ops-hub/main/bots/revoke_main/hurrier_bot.py",
    bat_raw: "https://raw.githubusercontent.com/naderfakhry-creator/talabat-ops-hub/main/bots/revoke_main/run_revoke_main.bat",
    pip: "pip install selenium gspread google-auth"
  },
  extend_shifts: {
    title: "Extend Shifts",
    desc: "بيمد الشيفتات للطيارين حسب طلب الوكلاء أوتوماتيك",
    py_raw: "https://raw.githubusercontent.com/naderfakhry-creator/talabat-ops-hub/main/bots/extend_shifts/extend_shifts_bot.py",
    bat_raw: "https://raw.githubusercontent.com/naderfakhry-creator/talabat-ops-hub/main/bots/extend_shifts/run_extension.bat",
    pip: "pip install selenium gspread google-auth webdriver-manager"
  }
};

const params = new URLSearchParams(window.location.search);
const botId = params.get("bot");
const bot = bots[botId];
const content = document.getElementById("content");

if (!bot) {
  content.innerHTML = "<p>بوت مش موجود.</p>";
} else {
  content.innerHTML = `
    <div class="title">${bot.title}</div>
    <div class="desc">${bot.desc}</div>

    <div class="card">

      <div class="step">
        <div class="step-num">1</div>
        <div class="step-content">
          <h3>تحميل ملف البوت</h3>
          <p>الملف الرئيسي اللي بيشغل البوت</p>
          <div class="btn-row">
            <a class="btn" href="${bot.py_raw}" target="_blank">عرض الكود</a>
          </div>
          <div class="guide">
            <div class="guide-title">كيفية حفظ الملف</div>
            <ol>
              <li>افتح الكود من الزرار فوق</li>
              <li>اعمل <b>Ctrl+A</b> عشان تحدد كله، بعدين <b>Ctrl+C</b></li>
              <li>اضغط <b>Windows+R</b>، اكتب <b>notepad</b>، اضغط Enter</li>
              <li>اعمل <b>Ctrl+V</b> عشان تلصق الكود</li>
              <li>اضغط <b>File → Save As</b>، اختار Desktop، واكتب الاسم بتاع الملف</li>
              <li>في Save as type اختار <b>All Files</b> واضغط Save</li>
            </ol>
          </div>
        </div>
      </div>

      <div class="step">
        <div class="step-num">2</div>
        <div class="step-content">
          <h3>تحميل ملف run_bot.bat</h3>
          <p>الملف اللي بتضغط عليه عشان تشغل البوت</p>
          <div class="btn-row">
            <a class="btn" href="${bot.bat_raw}" target="_blank">عرض الكود</a>
          </div>
          <div class="guide">
            <div class="guide-title">كيفية حفظ الملف</div>
            <ol>
              <li>افتح الكود من الزرار فوق</li>
              <li>اعمل <b>Ctrl+A</b> بعدين <b>Ctrl+C</b></li>
              <li>افتح Notepad جديد</li>
              <li>اعمل <b>Ctrl+V</b> عشان تلصق</li>
              <li>اضغط <b>File → Save As</b>، اختار نفس الفولدر، واكتب الاسم: <b>run_bot.bat</b></li>
              <li>في Save as type اختار <b>All Files</b> واضغط Save</li>
            </ol>
          </div>
        </div>
      </div>

      <div class="step">
        <div class="step-num">3</div>
        <div class="step-content">
          <h3>تحميل ملف الصلاحيات</h3>
          <p>حمّل ملف credentials.json من Google Drive وحطه في نفس الفولدر</p>
          <div class="btn-row">
            <a class="btn btn-secondary" href="https://drive.google.com/file/d/18iP3nkqA9Hpkz988wOvsmZ2eLzeiC1o2/view?usp=drive_link" target="_blank">فتح Google Drive</a>
          </div>
        </div>
      </div>

      <div class="step">
        <div class="step-num">4</div>
        <div class="step-content">
          <h3>تثبيت المتطلبات</h3>
          <p>افتح CMD وكتب الأمر ده مرة وحدة بس</p>
          <p style="background:#f5f5f5;padding:8px 12px;border-radius:6px;font-family:monospace;margin-top:8px;font-size:12px;">${bot.pip}</p>
        </div>
      </div>

      <div class="step">
        <div class="step-num">5</div>
        <div class="step-content">
          <h3>تشغيل البوت</h3>
          <p>دبل كليك على ملف <b>run_bot.bat</b> وهو هيشتغل لوحده</p>
        </div>
      </div>

      <div class="note">
        ⚠️ تأكد إن Python و Chrome مثبتين على جهازك قبل التشغيل
        <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;">
          <a class="btn" href="https://www.python.org/ftp/python/3.12.0/python-3.12.0-amd64.exe" target="_blank">تحميل Python</a>
          <a class="btn btn-secondary" href="https://www.google.com/chrome" target="_blank">تحميل Chrome</a>
        </div>
      </div>

    </div>
  `;
}
</script>

</body>
</html>
